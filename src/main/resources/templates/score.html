<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>成绩查询 | 蓝色简洁版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f2f5;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        /* 主容器卡片 */
        .grade-container {
            max-width: 680px;
            width: 100%;
            background: #ffffff;
            border-radius: 2rem;
            box-shadow: 0 20px 35px -10px rgba(0, 55, 100, 0.2);
            overflow: hidden;
            transition: 0.2s;
        }

        /* 蓝色头部区 */
        .hero-blue {
            background: #0a66b9;
            background-image: radial-gradient(circle at 0% 30%, rgba(255,255,255,0.1) 1.5%, transparent 2%);
            background-size: 32px 32px;
            padding: 2rem 2rem 1.8rem;
            text-align: center;
        }

        .hero-blue h1 {
            font-size: 2rem;
            font-weight: 600;
            color: white;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .hero-blue h1:before {
            content: "📘";
            font-size: 1.9rem;
        }

        .hero-blue .sub {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        /* 内容区块 */
        .content-panel {
            padding: 2rem 2rem 2rem;
        }

        /* 模拟“查询表单”区域 —— 完全静态，仅样式 */
        .mock-form {
            background: #f8fbfe;
            border-radius: 1.5rem;
            padding: 1.2rem 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid #dee9f2;
        }

        .mock-field {
            margin-bottom: 1.2rem;
        }

        .mock-field label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #1f5c8f;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .mock-input {
            width: 100%;
            background: white;
            border: 1px solid #caddf0;
            border-radius: 1.2rem;
            padding: 0.8rem 1rem;
            font-size: 0.95rem;
            color: #1e4663;
            font-family: inherit;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);
        }

        /* 伪按钮，仅为视觉效果 */
        .mock-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 0.8rem;
        }

        .mock-btn {
            flex: 1;
            text-align: center;
            padding: 0.7rem 0;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.9rem;
            background: #eef3fc;
            color: #2c6e9e;
            border: 1px solid #cfdff0;
            cursor: default;
            transition: none;
        }

        .mock-btn-primary {
            background: #0f6bc0;
            color: white;
            border: none;
            box-shadow: 0 2px 6px rgba(15,107,192,0.2);
        }

        /* 提示框: 静态指引 */
        .info-note {
            background: #e9f2fa;
            border-radius: 1rem;
            padding: 0.8rem 1.2rem;
            font-size: 0.8rem;
            color: #226797;
            margin-bottom: 1.8rem;
            border-left: 3px solid #2c7fd4;
        }

        /* 成绩卡片区域 - 展示所有学生成绩（示例数据）*/
        .student-list {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* 单个学生成绩卡片 简洁蓝色风 */
        .score-card {
            background: #ffffff;
            border-radius: 1.3rem;
            border: 1px solid #e2edf9;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
            transition: all 0.15s;
        }

        .score-card:hover {
            border-color: #c2dcf5;
            box-shadow: 0 8px 18px rgba(33, 101, 163, 0.08);
        }

        .card-header {
            background: #f6fafe;
            padding: 0.9rem 1.4rem;
            border-bottom: 1px solid #e8f0f8;
            border-radius: 1.3rem 1.3rem 0 0;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
        }

        .student-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #155f97;
            letter-spacing: -0.2px;
        }

        .student-id {
            background: #e4eff9;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #1e6193;
        }

        .score-table {
            width: 100%;
            border-collapse: collapse;
        }

        .score-table td {
            padding: 0.85rem 1.4rem;
            border-bottom: 1px solid #eff4fa;
            color: #244f74;
            font-weight: 500;
        }

        .score-table tr:last-child td {
            border-bottom: none;
        }

        .score-label {
            font-weight: 600;
            width: 35%;
            color: #1d5985;
            background-color: #fbfeff;
        }

        .score-value {
            font-weight: 600;
            color: #0a578e;
        }

        .total-row td {
            background: #f6fafe;
            font-weight: 700;
            color: #0a4e7c;
            border-top: 1px solid #e5eff8;
        }

        .badge-blue {
            background: #d6e9ff;
            padding: 0.2rem 0.65rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #0b62a4;
            margin-left: 0.6rem;
        }

        footer {
            margin-top: 1.8rem;
            text-align: center;
            font-size: 0.7rem;
            color: #7496b5;
            padding-top: 0.8rem;
            border-top: 1px solid #e2edf7;
        }

        @media (max-width: 550px) {
            .content-panel {
                padding: 1.5rem;
            }
            .card-header {
                flex-direction: column;
                gap: 0.4rem;
            }
            .score-table td {
                padding: 0.7rem 1rem;
            }
            .hero-blue h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
<div class="grade-container">
    <div class="hero-blue">
        <h1>成绩查询</h1>
        <div class="sub">严谨 · 清晰 · 一键掌握学业表现</div>
    </div>
    <div class="content-panel">
        <div class="mock-form">
            <div class="mock-field">
                <label>📌 学号 / 姓名</label>
                <div class="mock-input">示例: 2024001 或 张三</div>
            </div>
            <div class="mock-buttons">
                <div class="mock-btn mock-btn-primary">🔍 查询成绩</div>
                <div class="mock-btn">🗑️ 清空</div>
            </div>
        </div>

        <div class="info-note">
            💡 下方展示全部学生成绩记录（静态示例），纯HTML/CSS蓝色简洁风格，无JavaScript。
        </div>

        <!-- 成绩列表：显示全部预先设定的成绩，达到静态可查效果 -->
        <div class="student-list">
            <!-- 学生1：张三 -->
            <div class="score-card">
                <div class="card-header">
                    <span class="student-name">张 三 <span class="badge-blue">2024001</span></span>
                    <span class="student-id">📖 班级: 计算机1班</span>
                </div>
                <table class="score-table">
                    <tr>
                        <td class="score-label">语文</td>
                        <td class="score-value">88 分</td>
                    </tr>
                    <tr>
                        <td class="score-label">数学</td>
                        <td class="score-value">94 分</td>
                    </tr>
                    <tr>
                        <td class="score-label">英语</td>
                        <td class="score-value">87 分</td>
                    </tr>
                    <tr class="total-row">
                        <td class="score-label">🏆 总分</td>
                        <td class="score-value"><strong>269</strong> 分</td>
                    </tr>
                    <tr class="total-row">
                        <td class="score-label">⭐ 平均分</td>
                        <td class="score-value"><strong>90</strong> 分</td>
                    </tr>
                </table>
            </div>
        </div>
        <footer>
            ䷖ 蓝色简洁成绩单 | 静态数据展示 · 纯HTML/CSS
        </footer>
    </div>
</div>
</body>
</html>

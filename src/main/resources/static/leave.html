<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>请假申请 · 病事假审批</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f4f9;
            font-family: system-ui, 'Segoe UI', 'Roboto', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            padding: 24px;
            color: #1a2c3e;
        }

        /* 主容器 */
        .main-card {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        /* 顶部标题栏 */
        .page-header {
            padding: 20px 24px 12px 24px;
            border-bottom: 1px solid #e9ecef;
        }
        .page-header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #0a58ca;
            margin-bottom: 4px;
        }
        .page-header p {
            font-size: 13px;
            color: #6c7a8e;
        }

        /* 筛选栏 */
        .filter-bar {
            padding: 20px 24px;
            background: #f8fafd;
            border-bottom: 1px solid #eef2f6;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 16px;
        }
        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 150px;
        }
        .filter-item label {
            font-size: 12px;
            font-weight: 500;
            color: #4a5b6e;
            letter-spacing: 0.3px;
        }
        .filter-item input,
        .filter-item select {
            padding: 8px 12px;
            border: 1px solid #d0dae8;
            border-radius: 8px;
            font-size: 13px;
            background: white;
            outline: none;
        }
        .filter-item input:focus,
        .filter-item select:focus {
            border-color: #0a58ca;
            box-shadow: 0 0 0 2px rgba(10,88,202,0.1);
        }
        .btn-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn {
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            font-family: inherit;
            transition: 0.2s;
        }
        .btn-primary {
            background: #0a58ca;
            color: white;
        }
        .btn-primary:hover {
            background: #084298;
        }
        .btn-default {
            background: white;
            border: 1px solid #cbd5e1;
            color: #334155;
        }
        .btn-default:hover {
            background: #f1f5f9;
        }

        /* 操作栏 */
        .action-bar {
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #edf2f7;
            flex-wrap: wrap;
            gap: 12px;
        }
        .btn-add {
            background: #0a58ca;
            color: white;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .btn-add:hover {
            background: #084298;
        }
        .table-info {
            font-size: 13px;
            color: #5e6f8d;
        }

        /* 表格样式 */
        .table-wrapper {
            overflow-x: auto;
            padding: 0 24px 20px 24px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th {
            text-align: left;
            padding: 14px 12px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            font-weight: 600;
            color: #2c3e50;
        }
        td {
            padding: 14px 12px;
            border-bottom: 1px solid #f0f2f5;
            color: #2d3a4b;
            vertical-align: middle;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-pending {
            background: #fff3e0;
            color: #e65100;
        }
        .status-approved {
            background: #e6f7e6;
            color: #2e7d32;
        }
        .status-rejected {
            background: #ffe6e5;
            color: #c62828;
        }
        .action-buttons {
            display: flex;
            gap: 8px;
        }
        .btn-approve {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-approve:hover {
            background: #1b5e20;
        }
        .btn-reject {
            background: #c62828;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-reject:hover {
            background: #b71c1c;
        }
        .btn-edit {
            background: #0a58ca;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-edit:hover {
            background: #084298;
        }
        .btn-delete {
            background: #6c757d;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-delete:hover {
            background: #5a6268;
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s;
        }
        .modal-overlay.show {
            visibility: visible;
            opacity: 1;
        }
        .modal {
            background: white;
            width: 520px;
            max-width: 90%;
            border-radius: 20px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .modal-header {
            padding: 18px 24px;
            border-bottom: 1px solid #eef2f6;
            font-weight: 600;
            font-size: 18px;
            color: #0a58ca;
            background: #fefefe;
        }
        .modal-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .modal-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .modal-field label {
            font-size: 13px;
            font-weight: 500;
            color: #2c3e50;
        }
        .modal-field input,
        .modal-field select,
        .modal-field textarea {
            padding: 10px 12px;
            border: 1px solid #cbd5e6;
            border-radius: 10px;
            font-size: 13px;
            font-family: inherit;
        }
        .modal-field textarea {
            resize: vertical;
            min-height: 70px;
        }
        .modal-footer {
            padding: 16px 24px;
            background: #fafcff;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            border-top: 1px solid #eff3f8;
        }
        .btn-modal-confirm {
            background: #0a58ca;
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-modal-cancel {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 8px 24px;
            border-radius: 40px;
            cursor: pointer;
        }
        .btn-modal-cancel:hover {
            background: #f1f5f9;
        }
        .btn-modal-confirm:hover {
            background: #084298;
        }

        @media (max-width: 700px) {
            body {
                padding: 16px;
            }
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-group {
                justify-content: flex-start;
            }
            .action-buttons {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

<div class="main-card">
    <div class="page-header">
        <h1>请假申请 · 病事假审批</h1>
        <p>教师请假/调课申请管理 · 支持审批、新增、编辑、删除</p>
    </div>

    <!-- 筛选栏 -->
    <div class="filter-bar">
        <div class="filter-item">
            <label>申请人姓名</label>
            <input type="text" id="filterName" placeholder="请输入姓名">
        </div>
        <div class="filter-item">
            <label>请假类型</label>
            <select id="filterType">
                <option value="">全部</option>
                <option>病假</option>
                <option>事假</option>
                <option>调课</option>
                <option>公出</option>
            </select>
        </div>
        <div class="filter-item">
            <label>审批状态</label>
            <select id="filterStatus">
                <option value="">全部</option>
                <option>待审批</option>
                <option>已通过</option>
                <option>已拒绝</option>
            </select>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" id="searchBtn">🔍 查询</button>
            <button class="btn btn-default" id="resetBtn">重置</button>
        </div>
    </div>
    <!-- 操作栏 -->
    <div class="action-bar">
        <div class="table-info" id="recordCount">共 0 条记录</div>
    </div>

    <!-- 表格 -->
    <div class="table-wrapper">
        <table id="leaveTable">
            <thead>
            <tr>
                <th>序号</th><th>申请人</th><th>请假类型</th><th>开始时间</th><th>结束时间</th><th>事由</th><th>申请时间</th><th>状态</th><th>操作</th>
            </tr>
            </thead>
            <tbody id="tableBody">
            <!-- JS 动态渲染 -->
            </tbody>
        </table>
    </div>
</div>
</body>
<!-- 先引入 axios -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    // 请假数据存储
    let leaveData = [];
    let nextId = 1;

    // 获取当前日期字符串 YYYY-MM-DD
    function getTodayStr() {
        const d = new Date();
        return d.toISOString().slice(0,10);
    }
    // 从后端加载初始数据
    async function loadInitialData() {
        console.log("v")
        try {
            // 调用 GET 请求
            const res = await axios.get('/leave');
            console.log("s")
            const list = res.data.data;
            // data 就是后端的 Result.data，即成绩列表
            leaveData = list.map((item) => ({
                id: item.id,
                name: item.name,
                type: item.type,
                start_date: item.start_date,
                end_date: item.end_date,
                reason:item.reason,
                apply_time:item.apply_time,
                status: item.status
            }));

            // 更新 nextId
            if (leaveData.length > 0) {
                nextId = Math.max(...leaveData.map(s => s.id)) + 1;
            }

            // 初始渲染
            renderTable(leaveData);
        } catch (error) {
            console.error('加载数据失败:', error);
            leaveData = [];
            renderTable([]);
        }
    }

    // 渲染表格
    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        if (!data) data = leaveData;
        tbody.innerHTML = '';
        data.forEach((item, idx) => {
            const row = tbody.insertRow();
            row.insertCell(0).innerText = idx + 1;
            row.insertCell(1).innerText = item.name;
            row.insertCell(2).innerText = item.type;
            row.insertCell(3).innerText = item.start_date;
            row.insertCell(4).innerText = item.end_date;
            row.insertCell(5).innerText = item.reason;//.length > 20 ? item.reason.slice(0,20)+'…' : item.reason;
            row.insertCell(6).innerText = item.apply_time;
            // 状态徽章
            const statusCell = row.insertCell(7);
            let statusClass = '';
            if (item.status === '待审批') statusClass = 'status-pending';
            else if (item.status === '已通过') statusClass = 'status-approved';
            else statusClass = 'status-rejected';
            statusCell.innerHTML = `<span class="status-badge ${statusClass}">${item.status}</span>`;
            // 操作按钮
            const actionCell = row.insertCell(8);
            actionCell.className = 'action-buttons';
            let actions = '';
            if (item.status === '待审批') {
                actions = `<button class="btn-approve" data-id="${item.id}">✓ 通过</button>
                           <button class="btn-reject" data-id="${item.id}">✗ 拒绝</button>
                            `;
            } else if(item.status ==='已拒绝') {
                actions = `<button class="btn-approve" data-id="${item.id}">✓ 通过</button>`;
            }else {
                actions = `<button class="btn-approve" data-id="${item.id}">✓ 完成</button>`;
            }
            actionCell.innerHTML = actions;
        });
        document.getElementById('recordCount').innerText = `共 ${data.length} 条记录`;

        // 绑定按钮事件
        document.querySelectorAll('.btn-approve').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = parseInt(btn.getAttribute('data-id'));
                updateStatus(id, '已通过');
            });
        });
        document.querySelectorAll('.btn-reject').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = parseInt(btn.getAttribute('data-id'));
                updateStatus(id, '已拒绝');
            });
        });
    }

    // 更新审批状态
    function updateStatus(id, newStatus) {
        const item = leaveData.find(i => i.id === id);
        if (item) {
            item.status = newStatus;
            applyFilters();
        }
    }

    // 筛选逻辑
    function applyFilters() {
        let name = document.getElementById('filterName').value.trim().toLowerCase();
        let type = document.getElementById('filterType').value;
        let statusFilter = document.getElementById('filterStatus').value;
        let filtered = leaveData.filter(item => {
            let matchName = name === '' || item.name.toLowerCase().includes(name);
            let matchType = type === '' || item.type === type;
            let matchStatus = statusFilter === '' || item.status === statusFilter;
            return matchName && matchType && matchStatus;
        });
        renderTable(filtered);
    }

    function resetFilters() {
        document.getElementById('filterName').value = '';
        document.getElementById('filterType').value = '';
        document.getElementById('filterStatus').value = '';
        renderTable(leaveData);
    }



    // 事件绑定
    document.getElementById('searchBtn').addEventListener('click', applyFilters);
    document.getElementById('resetBtn').addEventListener('click', resetFilters);
    // 初始渲染
    renderTable(leaveData);
    loadInitialData()
</script>
</html>
